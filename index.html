<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PS Store Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f2f3f7;
      --card-bg: #ffffff;
      --text: #111111;
      --subtext: #888c94;
      --accent: #ff6b2b;
      --purple: #7b4dff;
      --green: #38c976;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 100px;
      overflow-x: hidden;
    }
    .hero {
      position: relative;
      width: 100%;
      height: 250px;
      background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.75) 100%),
                  url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=900&q=80') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px;
      color: #fff;
    }
    .hero-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .hero-bar {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text);
    }
    .hero-bar-info span {
      display: block;
      font-size: 11px;
      color: var(--subtext);
      font-weight: 600;
    }
    .hero-bar-info strong {
      font-size: 17px;
      font-weight: 800;
    }
    .hero-btn {
      background: #111;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .tabs-wrap {
      padding: 14px 12px 6px;
    }
    .tabs {
      background: #e6e8ef;
      border-radius: 999px;
      padding: 4px;
      display: flex;
      justify-content: space-between;
    }
    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 9px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: #fff;
      color: #111;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
